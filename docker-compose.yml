name: ai-chatbot

# ==============================================================================
# Docker Compose Configuration
# Target OS: Ubuntu 22.04.5 LTS (Jammy Jellyfish)
# Docker Engine: 29.9.1 / Docker Compose V2 Specification
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web Service (React SPA + Nginx)
  # ----------------------------------------------------------------------------
  web:
    container_name: ai-chatbot-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - VITE_APP_NAME=${APP_NAME:-AI Chatbot MVP}
      - VITE_API_BASE_URL=${API_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ----------------------------------------------------------------------------
  # 2. Database Service: PostgreSQL 17 with PGVector Extension
  # ----------------------------------------------------------------------------
  postgres:
    container_name: ai-chatbot-postgres
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. Object Storage: MinIO (Public Quay.io Mirror - Free Public Pull)
  # ----------------------------------------------------------------------------
  minio:
    container_name: ai-chatbot-minio
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${S3_PORT:-9000}:9000"         # S3 API Endpoint
      - "${S3_CONSOLE_PORT:-9001}:9001" # Web Console GUI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.20"
          memory: 256M

  # ----------------------------------------------------------------------------
  # 4. Workflow Engine: n8n (Official Docker Hub Image)
  # ----------------------------------------------------------------------------
  n8n:
    container_name: ai-chatbot-n8n
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Jakarta}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8nSecretKeyEncryption2026Secure!}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: ai_chatbot_postgres_data
    driver: local
  minio_data:
    name: ai_chatbot_minio_data
    driver: local
  n8n_data:
    name: ai_chatbot_n8n_data
    driver: local

# ------------------------------------------------------------------------------
# Bridge Network
# ------------------------------------------------------------------------------
networks:
  ai-network:
    name: ai_chatbot_network
    driver: bridge
