name: ai-chatbot

# ==============================================================================
# Docker Compose Configuration
# Target OS: Ubuntu 22.04.5 LTS (Jammy Jellyfish)
# Docker Engine: 29.9.1 / Docker Compose V2 Specification
#
# Configured Service Ports (Isolated Localhost Bindings):
# - Frontend:    127.0.0.1:8080 (Mapped to internal container port 3000)
# - Backend:     127.0.0.1:8000 (Mapped to internal container port 8000)
# - PostgreSQL:  127.0.0.1:5432 (Mapped to internal container port 5432)
# - MinIO S3:    127.0.0.1:9000 (API) & 127.0.0.1:9001 (Console)
# - n8n:         127.0.0.1:5678 (Workflow Automation)
# - Ollama LLM:  127.0.0.1:11434 (Qwen 2.5 3B Inference Engine)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web Service (React SPA + Nginx)
  # Accessible at: http://127.0.0.1:8080
  # ----------------------------------------------------------------------------
  web:
    container_name: ai-chatbot-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:3000"
    environment:
      - NODE_ENV=production
      - VITE_APP_NAME=${APP_NAME:-AI Chatbot MVP}
      - VITE_API_BASE_URL=${API_BASE_URL:-http://127.0.0.1:8000}
      - VITE_OLLAMA_URL=${VITE_OLLAMA_URL:-http://127.0.0.1:11434}
      - VITE_OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 2. Backend API Service (FastAPI + Python 3.12 - ADR-001)
  # Accessible at: http://127.0.0.1:8000 (Docs at http://127.0.0.1:8000/docs)
  # ----------------------------------------------------------------------------
  backend:
    container_name: ai-chatbot-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-ai_chatbot}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - N8N_URL=http://n8n:5678
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. Database Service: PostgreSQL 17 with PGVector Extension
  # Accessible at: 127.0.0.1:5432
  # ----------------------------------------------------------------------------
  postgres:
    container_name: ai-chatbot-postgres
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 4. Object Storage: MinIO (Chainguard Secure Distribution)
  # Accessible at: 127.0.0.1:9000 (S3 API) & 127.0.0.1:9001 (Web Console GUI)
  # ----------------------------------------------------------------------------
  minio:
    container_name: ai-chatbot-minio
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_BIND_IP:-127.0.0.1}:${S3_PORT:-9000}:9000"         # S3 API Endpoint
      - "${MINIO_BIND_IP:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001" # Web Console GUI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - ai-network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 5. Workflow Automation Engine: n8n (Official Docker Hub Image)
  # Accessible at: http://127.0.0.1:5678
  # ----------------------------------------------------------------------------
  n8n:
    container_name: ai-chatbot-n8n
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_BIND_IP:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Jakarta}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8nSecretKeyEncryption2026Secure!}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai-network
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 6. Local LLM Service: Ollama (Qwen 2.5: 3B)
  # Accessible at: http://127.0.0.1:11434
  # Compatible with 2-CPU / Low-resource servers (no fixed CPU cap)
  # ----------------------------------------------------------------------------
  ollama:
    container_name: ai-chatbot-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND_IP:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 7. Model Auto-Puller Helper for Ollama (Ensures qwen2.5:3b is pulled)
  # Runs once upon initial startup and exits cleanly
  # ----------------------------------------------------------------------------
  ollama-pull:
    container_name: ai-chatbot-ollama-pull
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama service to become healthy..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Checking if model '${OLLAMA_MODEL:-qwen2.5:3b}' is present..."
        if ! ollama list | grep -q "${OLLAMA_MODEL:-qwen2.5:3b}"; then
          echo "Model '${OLLAMA_MODEL:-qwen2.5:3b}' not found. Downloading via Ollama..."
          ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}
          echo "Successfully pulled model '${OLLAMA_MODEL:-qwen2.5:3b}'!"
        else
          echo "Model '${OLLAMA_MODEL:-qwen2.5:3b}' is already downloaded and ready to use."
        fi
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: ai_chatbot_postgres_data
    driver: local
  minio_data:
    name: ai_chatbot_minio_data
    driver: local
  n8n_data:
    name: ai_chatbot_n8n_data
    driver: local
  ollama_data:
    name: ai_chatbot_ollama_data
    driver: local

# ------------------------------------------------------------------------------
# Bridge Network
# ------------------------------------------------------------------------------
networks:
  ai-network:
    name: ai_chatbot_network
    driver: bridge
